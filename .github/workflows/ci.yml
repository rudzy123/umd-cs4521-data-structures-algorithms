name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests benchmarks
      - name: Format check
        run: ruff format --check src tests benchmarks
      - name: Unit and property tests
        run: pytest
      - name: Sorting benchmark smoke test
        run: python -m benchmarks.sort_bench --smoke
