[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umd-algorithms"
version = "1.0.0"
description = "Educational data structures and algorithms with explicit invariants, complexity, and tests."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Rudy M" }]
keywords = ["algorithms", "data-structures", "education", "umd"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umd_algorithms = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["umd_algorithms", "benchmarks"]
